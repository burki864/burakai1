    <style>
        :root {
            --accent-primary: #3b82f6;
            --accent-secondary: #a855f7;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --bg-dark: #020617;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            overflow: hidden;
            margin: 0;
            width: 100vw;
            height: 100vh;
        }
        #root {
            width: 100%;
            height: 100%;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6);
        }
        .gradient-text {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .accent-border {
            border-color: var(--accent-primary);
        }
        .accent-bg {
            background-color: var(--accent-primary);
        }
        .accent-shadow {
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        /* Mobile Specific Overrides */
        @media (max-width: 768px) {
            h1, h2 { font-size: clamp(2rem, 8vw, 4rem) !important; }
            .chat-bubble { font-size: 1rem !important; padding: 1.25rem !important; }
            .glass-panel { backdrop-filter: blur(16px); }
            textarea { font-size: 1.1rem !important; }
        }

        @keyframes toast-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-toast {
            animation: toast-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Generic Transition */
        .transition-theme {
            transition: background-color 0.5s ease, border-color 0.5s ease, color 0.5s ease, box-shadow 0.5s ease;
        }
    </style>
